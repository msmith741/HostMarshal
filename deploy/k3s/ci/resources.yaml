# Ephemeral K3s-only integration profile. Secrets, OAuth keys, TLS and
# capability config are created by the CI harness, not committed.
apiVersion: v1
kind: Namespace
metadata:
  name: hostmarshal-ci
---
apiVersion: v1
kind: Namespace
metadata:
  name: hostmarshal-ci-attacker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hostmarshal
  namespace: hostmarshal-ci
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostmarshal
  namespace: hostmarshal-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hostmarshal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hostmarshal
    spec:
      nodeSelector:
        hostmarshal.ci/role: backend
      serviceAccountName: hostmarshal
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Kubernetes prepares group-readable Secret projection and writable
        # tmpfs emptyDirs before the unprivileged init starts.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-protected-config
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              # UID 10001 owns the copied files; no chown or root required.
              umask 077
              cp /identity/auth.json /runtime/auth.json
              cp /identity/ingress.proof /runtime/ingress.proof
              cp /trust/keys.json /runtime/keys.json
              chmod 0600 /runtime/auth.json /runtime/ingress.proof
              chmod 0644 /runtime/keys.json
              proof="$(cat /identity/ingress.proof)"
              sed "s|@@INGRESS_PROOF@@|${proof}|g" /nginx-template/default.conf > /nginx-generated/default.conf
              chmod 0644 /nginx-generated/default.conf
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: identity
              mountPath: /identity
              readOnly: true
            - name: trust
              mountPath: /trust
              readOnly: true
            - name: runtime
              mountPath: /runtime
            - name: nginx-template
              mountPath: /nginx-template
              readOnly: true
            - name: nginx-generated
              mountPath: /nginx-generated
      containers:
        - name: hostmarshal
          image: hostmarshal-k3s-ci:ci
          imagePullPolicy: Never
          args:
            - http
            - --listen
            - 127.0.0.1:8338
            - --config-dir
            - /config
            - --auth-config
            - /runtime/auth.json
            - --audit-log
            - /runtime/audit.jsonl
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime
              mountPath: /runtime
        - name: ingress-sidecar
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          ports:
            - containerPort: 8080
              name: ingress
          volumeMounts:
            - name: nginx-generated
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: identity
          secret:
            secretName: hostmarshal-ci-identity
            # fsGroup 10001 can read the projection; copied runtime files
            # are UID 10001-owned, 0600, and independently validated.
            defaultMode: 0440
        - name: trust
          configMap:
            name: hostmarshal-ci-jwks
        - name: config
          configMap:
            name: hostmarshal-ci-config
        - name: nginx-template
          configMap:
            name: hostmarshal-ci-nginx
        - name: nginx-generated
          emptyDir:
            medium: Memory
        - name: runtime
          emptyDir:
            medium: Memory
        - name: nginx-tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: hostmarshal
  namespace: hostmarshal-ci
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hostmarshal
  ports:
    - name: ingress
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-only-ingress
  namespace: hostmarshal-ci
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hostmarshal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hostmarshal
  namespace: hostmarshal-ci
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mcp.hmci.example.test`) && (Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`))
      kind: Rule
      services:
        - name: hostmarshal
          port: 8080
  tls:
    secretName: hostmarshal-ci-tls
