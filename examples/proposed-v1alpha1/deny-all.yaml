# DESIGN FIXTURE ONLY: host and capability exist, but no Grant resource exists.
apiVersion: hostmarshal.io/v1alpha1
kind: Host
metadata:
  name: sample-linux
  labels:
    environment: staging
spec:
  address: sample-linux.example.invalid
---
apiVersion: hostmarshal.io/v1alpha1
kind: Capability
metadata:
  name: inventory.inspect
spec:
  operationRef: builtin.inventory.inspect/v1
  targetKind: Host
  exposure:
    mcp: true
  inputSchema:
    type: object
    properties:
      target:
        type: string
    required: [target]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      id:
        type: string
      hostname:
        type: string
    required: [id, hostname]
    additionalProperties: false
  limits:
    timeout: 2s
    maxOutputBytes: 4096
