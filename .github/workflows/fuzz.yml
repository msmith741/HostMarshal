name: YAML parser fuzz

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Coverage-guided parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly compiler
        run: rustup toolchain install nightly-2026-11-06 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-11-06 install cargo-fuzz --locked --version 0.13.2
      - name: Run bounded coverage-guided campaign
        run: cargo +nightly-2026-11-06 fuzz run yaml_manifest -- -max_total_time=60 -timeout=5 -max_len=8192
