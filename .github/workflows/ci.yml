name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'  # Weekly full integration matrix (UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Conservative regression impact selection
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.impact.outputs.verify }}
      protocol: ${{ steps.impact.outputs.protocol }}
      vault: ${{ steps.impact.outputs.vault }}
      oauth: ${{ steps.impact.outputs.oauth }}
      fuzz: ${{ steps.impact.outputs.fuzz }}
      k3s: ${{ steps.impact.outputs.k3s }}
      scope: ${{ steps.impact.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test selection logic and protect against unsafe bypass
        run: python3 -m unittest discover -s tests -p test_ci_impact.py
      - name: Reject changed-file whitespace errors
        run: git diff --check
      - name: Compute affected suites; uncertain changes always run everything
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$FORCE_FULL" == "true" ]]; then args+=(--full); fi
          python3 tests/ci_impact.py "${args[@]}"

  verify:
    needs: classify
    if: needs.classify.outputs.verify == 'true'
    name: Format, lint, tests and schema conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enforce locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Check generated JSON Schema matches versioned artifact
        run: cargo run --locked --quiet -- config schema | diff -u schemas/v1alpha1/resources.schema.json -
      - name: Independently validate schema and YAML fixtures
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/pip install --disable-pip-version-check -q 'jsonschema==4.25.1' 'PyYAML==6.0.3'
          .schema-venv/bin/python tests/schema_conformance.py
      - name: Install isolated SSH test daemon
        if: needs.classify.outputs.protocol == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
      - name: Provision disposable SSH accounts with bounded retries
        if: needs.classify.outputs.protocol == 'true'
        run: |
          for user in hmobserver hmvault; do
            for attempt in 1 2 3; do
              if getent passwd "$user" >/dev/null; then break; fi
              if sudo -n timeout -k 2s 12s useradd -m -s /bin/sh "$user"; then break; fi
              if [ "$attempt" -eq 3 ]; then
                echo "failed to provision disposable account: $user" >&2
                exit 1
              fi
              sleep 2
            done
            printf '%s:%s\n' "$user" "$(openssl rand -hex 24)" | sudo -n chpasswd
          done
      - name: Build and exercise MCP over stdio
        if: needs.classify.outputs.protocol == 'true'
        run: |
          cargo build --locked --bin hostmarshal
          python3 tests/mcp_smoke.py
          python3 tests/declarative_smoke.py
          python3 tests/reload_smoke.py
          python3 tests/mcp_modern_smoke.py
          python3 tests/audit_smoke.py
          python3 tests/audit_delivery_smoke.py
          python3 tests/policy_explain_smoke.py
          python3 tests/transport_smoke.py
          python3 tests/vault_ssh_smoke.py
          python3 -m venv .remote-auth-venv
          .remote-auth-venv/bin/pip install --disable-pip-version-check -q 'PyJWT==2.10.1' 'cryptography==46.0.3'
          .remote-auth-venv/bin/python tests/remote_http_smoke.py
          .remote-auth-venv/bin/python tests/remote_hardening_smoke.py

  vault-real:
    needs: classify
    if: needs.classify.outputs.vault == 'true'
    name: Real Vault TLS SSH signer interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enforce locked build
        run: cargo build --locked --bin hostmarshal
      - name: Install disposable OpenSSH test server
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
      - name: Provision isolated SSH account before Vault startup
        run: |
          # A transient passwd/NSS lock on hosted runners must not turn into
          # an unbounded hang after the Vault test has already started.
          # Only disposable CI account credentials; SSH password login is off.
          for attempt in 1 2 3; do
            if sudo -n timeout -k 2s 12s useradd -m -s /bin/sh hmvault; then
              break
            fi
            if getent passwd hmvault >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "failed to provision disposable SSH account" >&2
              exit 1
            fi
            sleep 2
          done
          printf 'hmvault:%s\n' "$(openssl rand -hex 24)" | sudo -n chpasswd
      - name: Run TLS real-Vault signing and revocation test
        run: python3 tests/vault_real_smoke.py

  fuzz-smoke:
    needs: classify
    if: needs.classify.outputs.fuzz == 'true'
    name: Coverage-guided fuzz target smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly compiler
        run: rustup toolchain install nightly-2026-11-06 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-11-06 install cargo-fuzz --locked --version 0.13.2
      - name: Build and run bounded fuzz target
        run: cargo +nightly-2026-11-06 fuzz run yaml_manifest -- -runs=512 -timeout=5 -max_len=8192

  ingress-oauth:
    needs: classify
    if: needs.classify.outputs.oauth == 'true'
    name: Traefik isolation and real Keycloak OAuth interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build locked HostMarshal binary
        run: cargo build --locked --bin hostmarshal
      - name: Install pinned disposable test helpers
        run: |
          python3 -m venv .oauth-ci-venv
          .oauth-ci-venv/bin/pip install --disable-pip-version-check -q 'PyJWT==2.10.1' 'cryptography==46.0.3'
      - name: Test real OAuth issuer and TLS-only Traefik isolation
        run: .oauth-ci-venv/bin/python tests/ingress_oidc_ci.py
