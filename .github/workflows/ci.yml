name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate review artifacts (temporary bootstrap step)
        run: |
          cargo generate-lockfile
          echo 'SCHEMA_BEGIN'
          cargo run --quiet -- config schema | sed 's/^/SCHEMA_LINE /'
          echo 'SCHEMA_END'
          echo 'LOCK_BEGIN'
          base64 -w0 Cargo.lock | fold -w 120 | sed 's/^/LOCK64 /'
          echo 'LOCK_END'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build and exercise MCP over stdio
        run: |
          cargo build --bin hostmarshal
          python3 tests/mcp_smoke.py
          python3 tests/declarative_smoke.py
